name: Validate develop

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared-node-ci:
    uses: naoiw/.github/.github/workflows/reusable-node-ci.yml@00047e65d7e53551e2644df02d2f22743ea2c471
    with:
      package-manager: pnpm
      node-version: "26"
      pnpm-version: "9"
      run-lint: false # No lint script
      run-typecheck: false # No typecheck script
      run-tests: true
      run-build: true

  # Validate the develop-only Next.js base path separately: the shared CI
  # intentionally builds with the default production settings.
  preview-paths:
    if: github.event_name == 'pull_request' || github.ref_name == 'develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: "9"
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build preview with /develop base path
        env:
          NEXT_PUBLIC_BASE_PATH: /develop
        run: pnpm build
      - name: Check preview paths
        run: |
          test -f out/index.html
          grep -q '/develop/_next/' out/index.html
          test -f out/blog/index.html
          test -f out/blog/markdown-blog-guide/index.html
          grep -q '/develop/blog/markdown-blog-guide/' out/blog/index.html
