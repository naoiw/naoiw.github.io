name: Deploy to GitHub Pages

# Always publish production and preview as one artifact from the default branch.
# The successful develop validation triggers a publication without replacing production.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Validate develop]
    types: [completed]
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.ref_name == 'main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: production

      - name: Checkout preview (validated develop revision)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'develop' }}
          path: preview

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            production/pnpm-lock.yaml
            preview/pnpm-lock.yaml

      - name: Test and build production
        working-directory: production
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build

      - name: Test and build preview
        working-directory: preview
        env:
          NEXT_PUBLIC_BASE_PATH: /develop
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build

      - name: Combine production and preview
        run: |
          mkdir -p publish/develop
          cp -a production/out/. publish/
          cp -a preview/out/. publish/develop/
          touch publish/.nojekyll
          test -f publish/index.html
          test -f publish/develop/index.html
          grep -q '/develop/_next/' publish/develop/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
